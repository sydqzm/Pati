<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Potito de Iván<nav></nav>
    </title>
    <meta name="description" content="Para Andrea :D">

    <!-- Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20100%22><text y=%22.9em%22 font-size=%2290%22>🌻</text></svg>">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Librerías 3D y Efectos -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body>

    <!-- ==============================================================
         PANTALLA DE INTRODUCCIÓN: CREACIÓN DE GIRASOLES & PREGUNTA
         ============================================================== -->
    <div id="intro-screen" class="intro-overlay">
        <div id="intro-stars" class="intro-stars-layer"></div>

        <!-- Título Romántico Superior (como en la imagen: "Para Ti - Te Amo 🌻") -->
        <!-- Título Romántico Superior -->
        <div class="intro-top-title">
            <h1 class="intro-title-text">
                <span>Para Ti - Te Amo</span>
                <svg class="title-svg-icon" viewBox="0 0 24 24" width="34" height="34"
                    style="vertical-align: middle; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.8));">
                    <circle cx="12" cy="12" r="4.5" fill="#4e2608" stroke="#ffb300" stroke-width="1.2" />
                    <path d="M12 1.5l1.2 3.5h3.8l-2.8 2.3 1 3.5-3.2-2.1-3.2 2.1 1-3.5-2.8-2.3h3.8z" fill="#ffd700" />
                    <path d="M12 22.5l-1.2-3.5h-3.8l2.8-2.3-1-3.5 3.2 2.1 3.2-2.1-1 3.5 2.8 2.3h-3.8z" fill="#ffd700" />
                    <path d="M1.5 12l3.5-1.2v-3.8l2.3 2.8 3.5-1-2.1 3.2 2.1 3.2-3.5-1-2.3 2.8v-3.8z" fill="#ffd700" />
                    <path d="M22.5 12l-3.5 1.2v3.8l-2.3-2.8-3.5 1 2.1-3.2-2.1-3.2 3.5 1 2.3-2.8v3.8z" fill="#ffd700" />
                </svg>
            </h1>
        </div>

        <!-- Contenedor del Ramo de Girasoles que crecen desde abajo -->
        <div class="intro-sunflowers-stage">
            <svg id="sunflower-bouquet-svg" viewBox="0 0 500 550" class="sunflowers-svg">
                <defs>
                    <!-- Gradiente del tallo verde -->
                    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#0f3813" />
                        <stop offset="35%" stop-color="#1e6b23" />
                        <stop offset="75%" stop-color="#2e7d32" />
                        <stop offset="100%" stop-color="#4caf50" />
                    </linearGradient>

                    <!-- Gradiente de las hojas -->
                    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#66bb6a" />
                        <stop offset="40%" stop-color="#2e7d32" />
                        <stop offset="100%" stop-color="#144d18" />
                    </linearGradient>

                    <!-- Gradiente de pétalos traseros (ámbar y anaranjado cálido) -->
                    <linearGradient id="petalBackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffb700" />
                        <stop offset="40%" stop-color="#ff9100" />
                        <stop offset="80%" stop-color="#ff6d00" />
                        <stop offset="100%" stop-color="#e65100" />
                    </linearGradient>

                    <!-- Gradiente de pétalos delanteros (amarillo radiante) -->
                    <linearGradient id="petalFrontGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffff56" />
                        <stop offset="35%" stop-color="#ffea00" />
                        <stop offset="70%" stop-color="#ffd600" />
                        <stop offset="100%" stop-color="#ff9800" />
                    </linearGradient>

                    <!-- Centro del girasol: rico marrón chocolate con borde dorado -->
                    <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#1e0c04" />
                        <stop offset="55%" stop-color="#361708" />
                        <stop offset="80%" stop-color="#54260d" />
                        <stop offset="94%" stop-color="#7a3d13" />
                        <stop offset="100%" stop-color="#c67d00" />
                    </radialGradient>

                    <!-- Símbolo de flor de girasol con doble capa de 32 pétalos y textura de semillas -->
                    <g id="sunflower-head-symbol">
                        <!-- Capa trasera de 16 pétalos -->
                        <g class="petals-back">
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(0)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(22.5)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(45)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(67.5)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(90)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(112.5)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(135)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(157.5)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(180)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(202.5)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(225)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(247.5)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(270)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(292.5)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(315)" />
                            <path d="M 0 -16 C -7.5 -25 -10 -45 0 -60 C 10 -45 7.5 -25 0 -16 Z"
                                fill="url(#petalBackGrad)" transform="rotate(337.5)" />
                        </g>
                        <!-- Capa delantera de 16 pétalos (rotada 11.25°) -->
                        <g class="petals-front">
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(11.25)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(33.75)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(56.25)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(78.75)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(101.25)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(123.75)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(146.25)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(168.75)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(191.25)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(213.75)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(236.25)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(258.75)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(281.25)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(303.75)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(326.25)" />
                            <path d="M 0 -15 C -6.8 -23 -8.5 -42 0 -56 C 8.5 -42 6.8 -23 0 -15 Z"
                                fill="url(#petalFrontGrad)" transform="rotate(348.75)" />
                        </g>
                        <!-- Centro café realista con texturizado de semillas concéntricas -->
                        <circle cx="0" cy="0" r="23" fill="url(#centerGrad)" stroke="#ffb300" stroke-width="1.6" />
                        <circle cx="0" cy="0" r="18" fill="none" stroke="#ffa000" stroke-width="1.8"
                            stroke-dasharray="3.5,2.5" opacity="0.8" />
                        <circle cx="0" cy="0" r="13" fill="none" stroke="#ffd54f" stroke-width="1.5"
                            stroke-dasharray="3,2.5" opacity="0.85" />
                        <circle cx="0" cy="0" r="8" fill="none" stroke="#ffe082" stroke-width="1.3"
                            stroke-dasharray="2.5,2" opacity="0.9" />
                        <circle cx="0" cy="0" r="3.5" fill="#1e0c04" />
                    </g>

                    <!-- Símbolo de hoja verde con nervaduras botánicas -->
                    <g id="leaf-symbol">
                        <path d="M 0 0 C -22 -18 -30 -46 -2 -68 C 26 -46 22 -18 0 0 Z" fill="url(#leafGrad)" />
                        <path d="M 0 0 L 0 -60 M 0 -20 L -11 -32 M 0 -20 L 11 -32 M 0 -36 L -12 -46 M 0 -36 L 12 -46"
                            stroke="#144d18" stroke-width="1.5" fill="none" opacity="0.65" />
                    </g>
                </defs>

                <!-- TALLOS Y HOJAS -->
                <!-- Tallos traseros: Superiores -->
                <path id="stem-top-left" class="stem stem-outer" d="M 250 535 Q 215 320 195 150" stroke="url(#stemGrad)"
                    stroke-width="8.5" stroke-linecap="round" fill="none" />
                <path id="stem-top-right" class="stem stem-outer" d="M 250 535 Q 285 320 305 150"
                    stroke="url(#stemGrad)" stroke-width="8.5" stroke-linecap="round" fill="none" />

                <!-- Tallos medios: Medios exteriores -->
                <path id="stem-mid-left" class="stem stem-mid" d="M 250 535 Q 170 380 130 250" stroke="url(#stemGrad)"
                    stroke-width="9" stroke-linecap="round" fill="none" />
                <path id="stem-mid-right" class="stem stem-mid" d="M 250 535 Q 330 380 370 250" stroke="url(#stemGrad)"
                    stroke-width="9" stroke-linecap="round" fill="none" />

                <!-- TALLO CENTRAL DE LA FLOR DE EN MEDIO (VISIBLE, PROMINENTE Y CONTINUO) -->
                <path id="stem-center" class="stem" d="M 250 535 L 250 285" stroke="url(#stemGrad)" stroke-width="11"
                    stroke-linecap="round" fill="none" />
                <!-- Pequeño cáliz de unión -->
                <polygon points="241,285 259,285 250,298" fill="#1b5e20" />

                <!-- Tallos delanteros: Bajos -->
                <path id="stem-outer-left" class="stem stem-outer" d="M 250 535 Q 195 445 170 375"
                    stroke="url(#stemGrad)" stroke-width="9" stroke-linecap="round" fill="none" />
                <path id="stem-outer-right" class="stem stem-outer" d="M 250 535 Q 305 445 330 375"
                    stroke="url(#stemGrad)" stroke-width="9" stroke-linecap="round" fill="none" />

                <!-- HOJAS BOTÁNICAS -->
                <!-- Hojas del tallo central -->
                <g transform="translate(245, 435) rotate(-45) scale(0.92)">
                    <g class="leaf leaves-group-1">
                        <use href="#leaf-symbol" />
                    </g>
                </g>
                <g transform="translate(255, 380) rotate(45) scale(0.88)">
                    <g class="leaf leaves-group-1">
                        <use href="#leaf-symbol" />
                    </g>
                </g>

                <!-- Hojas de tallos medios -->
                <g transform="translate(195, 410) rotate(-65) scale(0.95)">
                    <g class="leaf leaves-group-2">
                        <use href="#leaf-symbol" />
                    </g>
                </g>
                <g transform="translate(305, 410) rotate(65) scale(0.95)">
                    <g class="leaf leaves-group-2">
                        <use href="#leaf-symbol" />
                    </g>
                </g>
                <g transform="translate(150, 310) rotate(-40) scale(0.85)">
                    <g class="leaf leaves-group-2">
                        <use href="#leaf-symbol" />
                    </g>
                </g>
                <g transform="translate(350, 310) rotate(40) scale(0.85)">
                    <g class="leaf leaves-group-2">
                        <use href="#leaf-symbol" />
                    </g>
                </g>

                <!-- Hojas superiores y base densa -->
                <g transform="translate(210, 240) rotate(-35) scale(0.8)">
                    <g class="leaf leaves-group-3">
                        <use href="#leaf-symbol" />
                    </g>
                </g>
                <g transform="translate(290, 240) rotate(35) scale(0.8)">
                    <g class="leaf leaves-group-3">
                        <use href="#leaf-symbol" />
                    </g>
                </g>
                <g transform="translate(215, 500) rotate(-85) scale(0.95)">
                    <g class="leaf leaves-group-3">
                        <use href="#leaf-symbol" />
                    </g>
                </g>
                <g transform="translate(285, 500) rotate(85) scale(0.95)">
                    <g class="leaf leaves-group-3">
                        <use href="#leaf-symbol" />
                    </g>
                </g>

                <!-- CABEZAS DE GIRASOL (BLOOMING HEADS) -->
                <!-- Flores Superiores (2) -->
                <g transform="translate(195, 140) scale(0.98)">
                    <g id="flower-head-top-left" class="flower-head flower-head-outer">
                        <use href="#sunflower-head-symbol" />
                    </g>
                </g>
                <g transform="translate(305, 140) scale(0.98)">
                    <g id="flower-head-top-right" class="flower-head flower-head-outer">
                        <use href="#sunflower-head-symbol" />
                    </g>
                </g>

                <!-- Flores Medias Exteriores (2) -->
                <g transform="translate(130, 240) scale(0.94)">
                    <g id="flower-head-mid-left" class="flower-head flower-head-mid">
                        <use href="#sunflower-head-symbol" />
                    </g>
                </g>
                <g transform="translate(370, 240) scale(0.94)">
                    <g id="flower-head-mid-right" class="flower-head flower-head-mid">
                        <use href="#sunflower-head-symbol" />
                    </g>
                </g>

                <!-- Flor Central de Enmedio (1) -->
                <g transform="translate(250, 275) scale(1.06)">
                    <g id="flower-head-center" class="flower-head">
                        <use href="#sunflower-head-symbol" />
                    </g>
                </g>

                <!-- Flores Bajas Delanteras (2) -->
                <g transform="translate(170, 365) scale(0.92)">
                    <g id="flower-head-outer-left" class="flower-head flower-head-outer">
                        <use href="#sunflower-head-symbol" />
                    </g>
                </g>
                <g transform="translate(330, 365) scale(0.92)">
                    <g id="flower-head-outer-right" class="flower-head flower-head-outer">
                        <use href="#sunflower-head-symbol" />
                    </g>
                </g>
            </svg>
        </div>

        <!-- Pregunta Romántica con botones Sí / No -->
        <div id="intro-question-box" class="intro-question-box">
            <h2 class="question-text">
                <span>¿Estás feliz con este regalo?</span>
                <svg class="question-heart-icon" viewBox="0 0 24 24" width="20" height="20" fill="#ffd700"
                    style="vertical-align: -2px; margin-left: 4px;">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
            </h2>
            <div class="intro-buttons-row">
                <button id="btn-intro-yes" class="intro-choice-btn btn-yes">
                    <span>Sí</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"
                        style="vertical-align: -1px; margin-left: 4px;">
                        <path
                            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                    </svg>
                </button>
                <button id="btn-intro-no" class="intro-choice-btn btn-no">
                    <span>No</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"
                        style="vertical-align: -1px; margin-left: 4px;">
                        <path d="M12 2l2.4 4.8 5.3.8-3.8 3.7.9 5.3L12 16.1 7.2 18.6l.9-5.3-3.8-3.7 5.3-.8L12 2z" />
                    </svg>
                </button>
            </div>
            <!-- Notificación emergente interactiva -->
            <div id="intro-toast" class="intro-toast-bubble"></div>
        </div>
    </div>

    <!-- Contenedor 3D WebGL (Inmersivo y Limpio) -->
    <div id="canvas-container"></div>

    <!-- Capa de Interfaz Minimalista: Solo Título y Botón de Pétalos -->
    <div class="clean-ui-layer">
        <header class="clean-top-bar">
            <h1 class="clean-header-title">Galaxia de Flores Amarillas</h1>
            <button id="petal-rain-btn" class="clean-petal-btn" title="Lluvia de Pétalos">
                <span>Pétalos</span>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M12 2l2.4 4.8 5.3.8-3.8 3.7.9 5.3L12 16.1 7.2 18.6l.9-5.3-3.8-3.7 5.3-.8L12 2z" />
                </svg>
            </button>
        </header>
    </div>

    <!-- ==============================================================
         MODAL DE LA CARTA DEL CORAZÓN CENTRAL (ÚNICA CARTA)
         ============================================================== -->
    <div id="letter-modal" class="modal-overlay">
        <div class="romantic-card-container">
            <!-- Sello dorado repujado SVG -->
            <div class="wax-seal">
                <svg viewBox="0 0 40 40" width="32" height="32" fill="none">
                    <circle cx="20" cy="20" r="18" fill="#9b4e00" stroke="#ffd700" stroke-width="1.8" />
                    <circle cx="20" cy="20" r="6" fill="#3a1c04" stroke="#ffea00" stroke-width="1" />
                    <path
                        d="M20 5 L21.5 12 L18.5 12 Z M20 35 L21.5 28 L18.5 28 Z M5 20 L12 21.5 L12 18.5 Z M35 20 L28 21.5 L28 18.5 Z"
                        fill="#ffd700" />
                    <path
                        d="M9.4 9.4 L14.5 13.5 L12.5 15.5 Z M30.6 30.6 L25.5 26.5 L27.5 24.5 Z M30.6 9.4 L26.5 14.5 L24.5 12.5 Z M9.4 30.6 L13.5 25.5 L15.5 27.5 Z"
                        fill="#ffd700" />
                </svg>
            </div>

            <!-- Cabecera de la carta -->
            <div class="card-header-decor">
                <div class="card-title-block" style="width: 100%;">
                    <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px;">
                        <span id="modal-letter-recipient" class="letter-recipient-badge">Para: Mi Amor</span>
                        <span class="letter-recipient-badge"
                            style="background: rgba(255, 215, 0, 0.16); color: #ffd700; border-color: rgba(255, 215, 0, 0.45);">
                            El Núcleo de la Galaxia
                        </span>
                    </div>
                    <h2 id="modal-letter-title" class="card-title">Para el amor de mi vida</h2>
                </div>
            </div>

            <!-- Contenido de la carta -->
            <div id="modal-letter-body" class="card-body-scroll">
                <!-- Se llena dinámicamente -->
            </div>

            <!-- Firma -->
            <div class="letter-signature-block">
                <div class="letter-closing">Con todo mi corazón,</div>
                <div id="modal-letter-sender" class="letter-sender">Para siempre tuyo</div>
            </div>

            <!-- Botón de cierre hacia la galaxia -->
            <div class="card-actions-bar" style="justify-content: center;">
                <button class="card-close-btn close-modal-btn">
                    <span>Volver a la Galaxia</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"
                        style="vertical-align: -2px; margin-left: 6px;">
                        <path d="M12 2l2.4 4.8 5.3.8-3.8 3.7.9 5.3L12 16.1 7.2 18.6l.9-5.3-3.8-3.7 5.3-.8L12 2z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts de la Aplicación -->
    <script src="js/config.js?v=1.1"></script>
    <script src="js/audio.js?v=1.1"></script>
    <script src="js/galaxy.js?v=1.1"></script>
    <script src="js/flowers.js?v=1.1"></script>
    <script src="js/modal.js?v=1.1"></script>
    <script src="js/intro.js?v=1.2"></script>

    <!-- Inicialización -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Iniciar galaxia 3D
            window.galaxyApp = new YellowGalaxy();

            // Iniciar gestor de flores y raycasting
            window.galaxyApp.flowersManager = new FlowersManager(window.galaxyApp);

            // Iniciar audio en la primera interacción si no ha iniciado
            const handleFirstInteraction = () => {
                if (window.romanticAudio && !window.romanticAudio.isPlaying) {
                    window.romanticAudio.init();
                }
                window.removeEventListener('pointerdown', handleFirstInteraction);
            };
            window.addEventListener('pointerdown', handleFirstInteraction);
        });
    </script>
</body>
